[project]
name = "leaf-disease-detection"
version = "2.1.0"
description = "Plant leaf disease detection using EfficientNetV2-B0 transfer learning with SOTA augmentation and training strategies"
readme = "README.md"
requires-python = ">=3.14.6"
dependencies = [
  "torch",
  "torchvision",
  "torchaudio",
  "numpy",
  "Pillow",
  "seaborn",
  "scikit-learn",
  "statsmodels",
  "flask",
  "tensorboard",
  "opencv-python-headless",
  "keras-nightly",
  "tqdm>=4.68.3",
  "ultralytics>=8.4.75",
]

[project.scripts]
leaf-disease = "src.main:main"
leaf-disease-train = "src.training.train_model:main"
leaf-disease-evaluate = "src.evaluation.evaluate_model:main"
leaf-disease-predict = "src.pipeline.predict:main"
leaf-disease-figures = "src.visualization.generate_figures:main"
leaf-disease-multi-seed = "tools.run_multi_seed_experiment:main"

[tool.uv]
package = true
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/nightly/cu132"
explicit = true

[dependency-groups]
dev = [
  "mypy",
  "pytest",
  "ruff",
]

[tool.ruff]
target-version = "py314"
line-length = 79

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]
"src/training/*.py" = ["E402"]
"src/evaluation/*.py" = ["E402"]
"src/visualization/*.py" = ["E402", "F841"]
"src/visualization/generate_ablation_figures.py" = ["E741", "F841"]

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["src.visualization.*"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["config", "training_utils"]
ignore_errors = true
